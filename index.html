<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الذكية للحاسب الآلي | إشراف: عبدالرحمن محمود</title>
    <!-- خطوط احترافية جديدة تماماً -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-surface-elevated: #1e293b;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
            --coral: #f43f5e;
            --amber: #f59e0b;
            --cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-soft: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(129, 140, 248, 0.4);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* رأس الصفحة - Top Bar */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-soft);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .brand-meta h1 {
            font-family: 'Readex Pro', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .brand-meta span {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            display: block;
        }

        .sound-pill-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-soft);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'Readex Pro', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sound-pill-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* شريط التبويبات الفخم */
        .navigation-dock {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            overflow-x: auto;
            scrollbar-width: none;
            background: rgba(17, 24, 39, 0.6);
            border-bottom: 1px solid var(--border-soft);
            position: sticky;
            top: 73px;
            z-index: 990;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .navigation-dock::-webkit-scrollbar {
            display: none;
        }

        .dock-tab {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-soft);
            color: var(--text-sub);
            padding: 10px 18px;
            border-radius: 30px;
            font-family: 'Readex Pro', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .dock-tab:hover {
            color: #fff;
            background: rgba(99, 102, 241, 0.12);
            border-color: var(--border-hover);
        }

        .dock-tab.active {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: #fff;
            border-color: var(--primary-light);
            box-shadow: 0 4px 18px var(--primary-glow);
            transform: translateY(-1px);
        }

        /* المحتوى الرئيسي والبطاقات */
        .main-layout {
            max-width: 1100px;
            width: 100%;
            margin: 24px auto;
            padding: 0 18px 80px;
            flex: 1;
        }

        .view-panel {
            display: none;
            animation: modernFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .view-panel.active {
            display: block;
        }

        @keyframes modernFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* بطاقة المحتوى الزجاجية الفخمة */
        .custom-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, transform 0.3s;
        }

        .custom-card:hover {
            border-color: var(--border-hover);
        }

        .card-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .heading-title {
            font-family: 'Readex Pro', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .heading-title .icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }

        .tag-pill {
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-light);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'Readex Pro', sans-serif;
        }

        .tag-pill.exam {
            background: rgba(244, 63, 94, 0.12);
            color: #fb7185;
            border-color: rgba(244, 63, 94, 0.3);
        }

        /* شبكة الكروت الداخلية (Feature Cards) */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .feature-card {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .feature-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .feature-icon {
            font-size: 1.6rem;
            color: var(--accent);
            margin-bottom: 12px;
            display: inline-block;
        }

        .feature-card h4 {
            font-family: 'Readex Pro', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .feature-card p {
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.7;
        }

        /* الأكورديون التفاعلي المطور */
        .custom-accordion {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .accordion-card {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: 0.3s;
        }

        .accordion-card:hover {
            border-color: var(--border-hover);
        }

        .accordion-trigger {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            font-size: 1.05rem;
            color: #f1f5f9;
        }

        .accordion-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .accordion-title-wrap i {
            color: var(--primary-light);
            font-size: 1.1rem;
        }

        .accordion-indicator {
            color: var(--text-sub);
            transition: transform 0.3s ease;
            font-size: 0.9rem;
        }

        .accordion-card.active .accordion-indicator {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .accordion-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
            padding: 0 20px;
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 0.96rem;
        }

        .accordion-card.active .accordion-panel {
            padding: 10px 20px 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 2500px;
        }

        /* بطاقات العلماء المحدثة */
        .scholar-row {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 14px;
            transition: 0.3s;
        }

        .scholar-row:hover {
            border-color: var(--primary-light);
            transform: scale(1.015);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .scholar-icon-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            flex-shrink: 0;
        }

        .scholar-details h3 {
            font-family: 'Readex Pro', sans-serif;
            font-size: 1.15rem;
            color: #fff;
            margin-bottom: 2px;
        }

        .scholar-details .role-text {
            font-size: 0.82rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .scholar-details p {
            font-size: 0.92rem;
            color: var(--text-sub);
            line-height: 1.65;
        }

        /* الاختبار التفاعلي */
        .quiz-wrapper {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-top: 15px;
        }

        .quiz-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-soft);
        }

        .points-badge {
            font-family: 'Readex Pro', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent-glow);
        }

        .question-lead {
            font-size: 1.15rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .options-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-soft);
            color: #f8fafc;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            text-align: right;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-button:hover:not(.locked) {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary-light);
            transform: translateX(-4px);
        }

        .option-button.correct-choice {
            background: rgba(16, 185, 129, 0.25) !important;
            border-color: var(--accent) !important;
            color: #6ee7b7 !important;
            font-weight: 700;
        }

        .option-button.wrong-choice {
            background: rgba(244, 63, 94, 0.25) !important;
            border-color: var(--coral) !important;
            color: #fda4af !important;
            font-weight: 700;
        }

        .hint-container {
            margin-top: 15px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, 0.35);
            border-right: 4px solid var(--cyan);
            font-size: 0.92rem;
            color: #e2e8f0;
            display: none;
            line-height: 1.6;
        }

        .cta-button {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-family: 'Readex Pro', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: 0.3s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        /* الفوتر */
        .footer-bar {
            text-align: center;
            padding: 24px 16px;
            background: rgba(9, 13, 22, 0.95);
            border-top: 1px solid var(--border-soft);
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .footer-bar strong {
            color: var(--primary-light);
        }

        @media (max-width: 768px) {
            .app-header { padding: 12px 16px; }
            .navigation-dock { top: 69px; padding: 10px 16px; }
            .custom-card { padding: 20px 16px; border-radius: var(--radius-md); }
            .scholar-row { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="app-header">
        <div class="brand-container">
            <div class="brand-badge">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <div class="brand-meta">
                <h1>المنصة الذكية للحاسب الآلي</h1>
                <span>تكنولوجيا الأغذية والألبان | المستوى الثالث</span>
            </div>
        </div>
        <button class="sound-pill-btn" id="soundToggle" onclick="toggleAudioEngine()">
            <i class="fa-solid fa-volume-high"></i>
            <span>الصوت: مفعّل</span>
        </button>
    </header>

    <!-- شريط الأقسام المطور -->
    <nav class="navigation-dock">
        <button class="dock-tab active" onclick="activateSection('sec-intro')"><i class="fa-solid fa-compass"></i> الأساسيات</button>
        <button class="dock-tab" onclick="activateSection('sec-hardware')"><i class="fa-solid fa-microchip"></i> العتاد والذاكرة</button>
        <button class="dock-tab" onclick="activateSection('sec-software')"><i class="fa-solid fa-shield-halved"></i> البرمجيات والفيروسات</button>
        <button class="dock-tab" onclick="activateSection('sec-networks')"><i class="fa-solid fa-globe"></i> الشبكات والإنترنت</button>
        <button class="dock-tab" onclick="activateSection('sec-ai')"><i class="fa-solid fa-brain"></i> الذكاء الاصطناعي</button>
        <button class="dock-tab" onclick="activateSection('sec-control')"><i class="fa-solid fa-sliders"></i> التحكم الآلي</button>
        <button class="dock-tab" onclick="activateSection('sec-stats')"><i class="fa-solid fa-chart-simple"></i> التحليل الإحصائي</button>
        <button class="dock-tab" onclick="activateSection('sec-food')"><i class="fa-solid fa-industry"></i> التصنيع الغذائي</button>
        <button class="dock-tab" onclick="activateSection('sec-scholars')"><i class="fa-solid fa-user-astronaut"></i> رواد العلم</button>
        <button class="dock-tab" onclick="activateSection('sec-quiz-bank')"><i class="fa-solid fa-circle-check"></i> الاختبار والمقالي</button>
    </nav>

    <!-- المحتوى واللوحات -->
    <main class="main-layout">

        <!-- 1. الأساسيات -->
        <section id="sec-intro" class="view-panel active">
            <div class="custom-card">
                <div class="card-heading">
                    <div class="heading-title">
                        <div class="icon-wrap"><i class="fa-solid fa-laptop-code"></i></div>
                        مفهوم الحاسوب وفكرة عمله
                    </div>
                    <span class="tag-pill">الوحدة 1</span>
                </div>
                <p style="line-height: 1.8; color: #e2e8f0; margin-bottom: 20px;">
                    <strong>الحاسوب (Computer):</strong> جهاز إلكتروني يقوم باستقبال البيانات وتخزينها، وإجراء المعالجة الحسابية والمنطقية عليها طبقاً لتعليمات البرامج المخزنة، ثم استخراج ال
